<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRG CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--canvas:#f1f2f1;--card:#fff;--ink:#17181a;--mut:#6a6f72;--line:#e1e4e3;--soft:#f6f7f6;--brass:#b08a4e;--brass-ink:#8a6a33;--sea:#2c6468;--sea-bg:#e1efee;--bad:#b23a30;--bad-bg:#f8e6e3;--side:#151618;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Figtree',system-ui,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root{--canvas:#101112;--card:#1a1c1d;--ink:#ecedea;--mut:#9aa0a2;--line:#2b2e30;--soft:#202325;--brass:#cba66a;--brass-ink:#d9b97f;--sea:#6fb3b3;--sea-bg:#1e3436;--bad:#e0766b;--bad-bg:#3a2321;--side:#0b0c0d}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--sans);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}a:hover{text-decoration-color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
/* shell */
.nav{position:fixed;inset:0 auto 0 0;width:236px;background:var(--side);color:#c9cccd;display:flex;flex-direction:column;padding:22px 14px 16px;z-index:20}
.brand{font-family:var(--serif);color:#fff;font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1;padding:2px 10px 22px}.brand small{display:block;font:500 10.5px/1 var(--sans);letter-spacing:.28em;color:#9a9da0;margin-top:7px}
.nav a.i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#c9cccd;text-decoration:none;font-weight:500;margin-bottom:2px;position:relative}
.nav a.i svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a.i:hover{background:rgba(255,255,255,.06);color:#fff}.nav a.i.on{background:rgba(255,255,255,.09);color:#fff}.nav a.i.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.nav .sp{flex:1}.nav .me{font-size:12.5px;color:#9a9da0;padding:0 10px;overflow:hidden;text-overflow:ellipsis}
.meter{padding:12px 10px;margin-bottom:6px}.meter .t{display:flex;justify-content:space-between;font-size:12px;color:#9a9da0;margin-bottom:6px}.meter .b{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.meter .b i{display:block;height:100%;width:0;background:var(--brass);border-radius:4px}.meter.hot .b i{background:#e0766b}
.wrap{margin-left:236px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 32px;position:sticky;top:0;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid var(--line)}
.top .sp{flex:1}.top .mb{display:none}
main{max-width:1180px;margin:0 auto;padding:28px 32px 80px}
/* type */
h1{font:600 34px/1.1 var(--serif);margin:0 0 4px;letter-spacing:.005em}h1 small{font:400 15px var(--sans);color:var(--mut);letter-spacing:0;margin-left:6px}
h2{font:600 16px/1.3 var(--sans);margin:0 0 12px}.sub{color:var(--mut);margin:0 0 22px}
.mut{color:var(--mut)}.num{font-family:var(--serif);font-weight:600}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--mut);text-decoration:none;font-size:14px;margin-bottom:14px}.back:hover{color:var(--ink)}
/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card>h2:first-child{margin-top:-2px}
.grid{display:grid;gap:16px;align-items:start}.g2{grid-template-columns:1fr 1fr}.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp-b{justify-content:space-between}
/* controls */
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;width:100%}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 25%,transparent)}
textarea{min-height:96px;resize:vertical;line-height:1.5}input[type=checkbox]{width:auto;min-height:0;accent-color:var(--ink)}
.btn,button{font:500 14px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 15px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover,button:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}button:disabled{opacity:.45;cursor:default}
button.p,.btn.p{background:var(--ink);color:var(--card);border-color:var(--ink)}button.p:hover,.btn.p:hover{opacity:.88}
button.d{color:var(--bad);background:transparent}button.d:hover{background:var(--bad-bg);border-color:transparent}
button.s{padding:3px 10px;min-height:30px;font-size:13px}button.g{border-color:transparent;background:transparent;color:var(--mut)}button.g:hover{background:var(--soft);color:var(--ink)}
label.l{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:0 0 5px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.f.one{grid-template-columns:1fr}.f.two{grid-template-columns:1fr 1fr}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar input,.bar select{width:auto}.bar .grow{flex:1;min-width:220px}
.search{position:relative;flex:1 1 300px;min-width:200px}.show-m{display:none}.search svg{position:absolute;left:12px;top:12px;width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round}.bar .search input,.search input{padding-left:38px;width:100%}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer;font-size:14px;user-select:none}.chip:has(input:checked){background:var(--ink);color:var(--card);border-color:var(--ink)}.chip input{position:absolute;opacity:0;width:0;height:0}.chip:has(input:focus-visible){outline:2px solid var(--brass);outline-offset:2px}
/* pills */
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--mut);border:1px solid var(--line);margin-right:4px;white-space:nowrap}
.tag.ok{background:var(--sea-bg);color:var(--sea);border-color:transparent}.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.tag.w{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass-ink);border-color:transparent}
.av{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--brass) 20%,var(--card));color:var(--brass-ink);display:inline-grid;place-items:center;font-weight:600;font-size:14px;flex:none}.av.lg{width:64px;height:64px;font:600 26px var(--serif)}
/* tables */
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:13px;font-weight:500;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--line)}
td.mut,.due{white-space:nowrap}td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tr.l{cursor:pointer}tr.l:hover td{background:var(--soft)}
.tbl{padding:0;overflow:hidden}.tbl table{margin:0}.cell{display:flex;gap:12px;align-items:center}
.thumb{width:88px;height:64px;object-fit:cover;border-radius:8px;background:var(--soft);display:block}
.pg{display:flex;gap:12px;align-items:center;justify-content:center;padding:16px;border-top:1px solid var(--line)}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}
/* dashboard */
.stats{display:flex;gap:0;margin:6px 0 26px;flex-wrap:wrap}.stat{padding:2px 34px 2px 0;margin-right:34px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font:600 52px/1 var(--serif)}.stat span{color:var(--mut);font-size:14px}
.todo{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.todo:last-child{border:0}.todo .t{flex:1;min-width:0}.todo .t div{overflow:hidden;text-overflow:ellipsis}
.tick{width:24px;height:24px;border-radius:50%;border:1.7px solid var(--mut);background:transparent;padding:0;min-height:0;flex:none;display:inline-grid;place-items:center}.tick:hover{border-color:var(--sea);background:var(--sea-bg)}
.due{font-size:13px;color:var(--mut)}.due.late{color:var(--bad);font-weight:500}.due.today{color:var(--brass-ink);font-weight:500}
.bars .r{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:14px}.bars .r i{display:block;height:8px;border-radius:8px;background:color-mix(in srgb,var(--brass) 70%,var(--card))}.bars .r .n{text-align:right;color:var(--mut)}
/* notes */
.note{padding:12px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}.note:last-child{border:0}.note small{display:block;color:var(--mut);margin-top:5px;font-size:13px;white-space:normal}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
/* contact header + property hero */
.hd{display:flex;gap:18px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.hd .grow{flex:1;min-width:200px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-bottom:22px;align-items:stretch}
.hero .pics{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:230px;border-radius:12px;overflow:hidden;background:var(--soft)}.hero .pics img{width:100%;height:100%;object-fit:cover;display:block}.hero .pics img:first-child{grid-row:1/3}.hero .pics.one{grid-template-columns:1fr}.hero .pics.one img{grid-row:auto}
.hero .pics .none{display:grid;place-items:center;color:var(--mut);grid-column:1/-1;grid-row:1/-1}
.price{font:600 44px/1 var(--serif);margin:8px 0 10px}.facts{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--mut)}.facts b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}.tabs a{padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap}.tabs a:hover{color:var(--ink);background:var(--soft)}.tabs a.on{background:var(--ink);color:var(--card)}
.sec{padding:4px 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.sec:last-of-type{border:0;margin-bottom:0}.sec h2{font-size:17px;margin-bottom:3px}.sec p.h{margin:0 0 14px;color:var(--mut);font-size:14px}
.sw{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.sw:last-child{border:0}.sw input{margin-top:3px;width:18px;height:18px}.sw b{display:block;font-weight:500}.sw span{color:var(--mut);font-size:13.5px}
.save{position:sticky;bottom:0;margin:22px -20px -20px;padding:14px 20px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-radius:0 0 12px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
/* photos + features */
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.ph>div{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.ph img{width:100%;height:124px;object-fit:cover;display:block}.ph .c{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:13px;color:var(--mut)}.ph .hid img{opacity:.3}.ph .c button{padding:0 8px;min-height:28px}
.ph .cov{display:none;position:absolute;top:8px;left:8px;background:var(--ink);color:var(--card);font:500 12px var(--sans);font-style:normal;padding:2px 9px;border-radius:999px}.ph>div:first-child .cov{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;background:var(--card)}.chips label:hover{border-color:var(--mut)}.chips label.on{background:var(--ink);color:var(--card);border-color:var(--ink)}.chips input{display:none}
.fg{border-top:1px solid var(--line);padding:2px 0}.fg summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 2px;font:600 15px var(--sans)}.fg summary::-webkit-details-marker{display:none}.fg summary::after{content:'+';margin-left:12px;color:var(--mut);font-weight:400}.fg[open] summary::after{content:'–'}.fg summary span{flex:1}.fg summary em{font-style:normal;font-size:13px;font-weight:400}.fg .chips{padding:0 0 18px}.addf{display:inline-flex;gap:6px;align-items:center}.chips .addf input{display:inline-block;width:190px;min-height:34px;padding:4px 10px}
.bulk{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:var(--card);border-radius:12px 12px 0 0}.bulk b{margin-right:6px}.bulk button{background:transparent;color:var(--card);border-color:rgba(255,255,255,.35)}.bulk button.d{border-color:#e07a6e;color:#f1a79e}.bulk[hidden]{display:none}td.ck,th.ck{width:34px;padding-right:0}td.ck input,th.ck input{width:18px;height:18px}
.upz{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;margin-bottom:16px}.upz.over{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 8%,transparent)}.ph .c a{font-size:12.5px}.ph .c a.dd{color:var(--bad)}
.wmp{position:relative;aspect-ratio:3/2;max-width:520px;border-radius:10px;overflow:hidden;background:linear-gradient(#9fc3dd 0 45%,#d9d2c3 45% 70%,#bdb3a0 70%);display:flex;align-items:center;justify-content:center}.wmp img{display:block;height:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 20px;border-radius:10px;z-index:99;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25)}
details.m{position:relative}details.m summary{list-style:none}details.m summary::-webkit-details-marker{display:none}details.m .menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 12px 34px rgba(0,0,0,.14)}details.m .menu a{display:block;padding:9px 12px;border-radius:7px;text-decoration:none}details.m .menu a:hover{background:var(--soft)}
@media(max-width:1000px){.cols,.hero{grid-template-columns:1fr}}
@media(max-width:860px){
 .nav{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}.brand,.nav .sp,.nav .me,.meter{display:none}
 .nav a.i{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:7px 2px;margin:0;text-align:center}.nav a.i.on::before{display:none}.nav a.i.on{background:rgba(255,255,255,.1)}
 .wrap{margin:0;padding-bottom:74px}.top{padding:10px 16px}.top .mb{display:block;font:700 22px var(--serif)}main{padding:20px 16px 40px}h1{font-size:29px}.g2{grid-template-columns:1fr}.stat{padding-right:20px;margin-right:20px}.stat b{font-size:42px}
 .hero .pics{height:190px}.price{font-size:38px}.thumb{width:64px;height:50px}.hide-m{display:none}.show-m{display:block}.bar .search{flex-basis:100%}.save{bottom:70px}.f.two{grid-template-columns:1fr}.bars .r{grid-template-columns:90px 1fr 40px}
}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style></head><body>

<script>
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.method||'GET',headers:{'content-type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error);return j};
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)};
const eur=n=>n?new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n):'';
const fd=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?String(s):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const ini=n=>(String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();
const today=()=>new Date().toISOString().slice(0,10);
const opts=(arr,sel,blank='')=>`<option value="">${blank}</option>`+arr.map(x=>{const v=x.code??x.id??x,l=x.label??x.name??x;return `<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(l)}</option>`}).join('');
const ICON_SEARCH='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>';
let L={},F=[];const st={};
let LB=[];
async function boot(){[L,F,LB]=await Promise.all([api('/lookups'),api('/features'),api('/labels')]);$('#me').textContent=(await api('/me')).email;router();usage()}
async function usage(){try{const u=await api('/usage');$('#use').textContent=`${(u.reads/1e6).toFixed(2)}M of 5M`;$('#usebar').style.width=Math.min(100,u.reads/5e6*100)+'%';$('#meter').classList.toggle('hot',u.reads>u.soft);$('#meter').title='Free daily limit is 5 million row reads. The CRM stops itself at '+(u.hard/1e6)+' million to protect it.'}catch(e){}}
function router(){const h=location.hash.slice(1)||'/';$('#addm').open=false;scrollTo(0,0);
 document.querySelectorAll('.nav a.i').forEach(a=>{const r=a.dataset.r;a.classList.toggle('on',r==='/'?h==='/':h===r||h.startsWith(r+'/'))});
 const m=(re)=>h.match(re);let r;

 <div class="tabs">${[['details','Details'],['desc','Descriptions'],['feat','Features'],['photos','Photos'],['owners','Owners']].map(([k,l])=>`<a class="${k===tab?'on':''}" onclick="st.tab='${k}';prop(${id},'${k}')">${l}</a>`).join('')}</div>

 if(tab==='desc'){const draw=()=>{const l=$('#lg').value;st.lang=l;const t=p.texts.find(x=>x.lang===l)||{};$('#tx').innerHTML=`<div class="f one">${fld('Title',`<input id="t_title" value="${esc(t.title||'')}">`)}${fld('Short description',`<textarea id="t_short">${esc(t.short_description||'')}</textarea>`)}${fld('Full description',`<textarea id="t_full" style="min-height:300px">${esc(t.full_description||'')}</textarea>`)}</div>`};$('#lg').onchange=()=>{keep();draw()};const keep=()=>{const l=st.lang||'en';let t=p.texts.find(x=>x.lang===l);if(!t)p.texts.push(t={lang:l});t.title=$('#t_title').value;t.short_description=$('#t_short').value;t.full_description=$('#t_full').value};draw();st.keep=keep}

function bindF(i){i.onchange=()=>{i.parentNode.classList.toggle('on',i.checked);const d=i.closest('.fg'),a=d.querySelectorAll('.chips input'),c=[...a].filter(x=>x.checked).length;d.querySelector('summary em').textContent=c?c+' of '+a.length:a.length;$('#fcount').innerHTML='<b>'+document.querySelectorAll('.chips input:checked').length+'</b> selected'}}
function addFeat(g,btn){const w=btn.parentNode;w.innerHTML='<input placeholder="New feature name" aria-label="New feature name"><button type="button" class="p s">Add</button>';const inp=w.querySelector('input'),go=async()=>{const v=inp.value.trim();if(!v)return;const r=await api('/features',{method:'POST',body:{label_en:v,label_pt:v,grp:g}});F.push({id:r.id,kind:'bit',label_en:v,label_pt:v,grp:g,active:1,custom:1});const l=document.createElement('label');l.className='on';l.innerHTML='<input type="checkbox" data-f="'+r.id+'" checked>'+esc(v)+' ★';w.parentNode.insertBefore(l,w);bindF(l.firstChild);l.firstChild.onchange();w.innerHTML='<button type="button" class="s" onclick="addFeat(\''+g+'\',this)">+ Add</button>'};w.querySelector('button').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};inp.focus()}

const toBlob=(file,W=1600,H=1200,q=.82)=>new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.max(W/im.width,H/im.height),sw=W/k,sh=H/k,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);c.toBlob(b=>{URL.revokeObjectURL(u);ok(b)},'image/jpeg',q)};im.onerror=()=>no(new Error('Could not read '+file.name));im.src=u});
async function uploadPhotos(id,files){if(!files.length)return;const el=$('#ups');let n=0;try{for(const f of files){el.textContent=` Uploading ${++n} of ${files.length}…`;const b=await toBlob(f);const r=await fetch(`/api/properties/${id}/photos`,{method:'POST',headers:{'content-type':'image/jpeg'},body:b});if(!r.ok)throw new Error((await r.json()).error)}toast(files.length+' photo'+(files.length>1?'s':'')+' added')}catch(e){alert('Upload stopped: '+e.message)}prop(id,'photos')}

 <table>${Object.keys(GRP).flatMap(g=>{const fs=F.filter(f=>f.grp===g&&f.kind!=='text'&&f.kind!=='select');return fs.length?[`<tr><th colspan="4" style="padding:16px 0 4px;font:600 14px var(--sans)">${GRP[g]} <span class="mut" style="font-weight:400">(${fs.length})</span></th></tr>`,...fs]:[]}).map(f=>typeof f==='string'?f:`<tr><td style="padding-left:0;width:42%"><input style="width:100%" value="${esc(f.label_en||f.label_pt)}" onchange="renF(${f.id},this.value)" aria-label="Feature name"></td><td class="mut">${f.custom?'★ ':''}<select aria-label="Category" onchange="regF(${f.id},this.value)">${Object.entries(GRP).map(([k,v])=>`<option value="${k}" ${k===f.grp?'selected':''}>${v}</option>`).join('')}</select></td><td class="mut hide-m">${f.used} used</td><td style="padding-right:0;text-align:right"><button class="s" onclick="hideF(${f.id},${f.active?0:1})">${f.active?'Hide':'Show'}</button> ${f.custom||!f.used?`<button class="s d" onclick="delF(${f.id})">Delete</button>`:''}</td></tr>`).join('')}</table></div>
 <div><div class="card"><h2>Contact sources</h2><p class="mut" style="margin-top:0">The “where they came from” list on contacts.</p><div class="chips">${(L.origin||[]).map(o=>`<label>${esc(o.label)}<button class="s d" style="min-height:0;padding:0 4px;border:0" aria-label="Remove" onclick="delLk('origin','${esc(o.code).replace(/'/g,"\\'")}')">×</button></label>`).join('')}</div><div class="bar" style="margin:14px 0 0"><input id="no" placeholder="New source" style="flex:1"><button id="noa">Add</button></div></div>
 <div class="card"><h2>Team</h2>${L.users.map(u=>`<div class="todo"><span class="av">${esc(ini(u.name))}</span><div class="t">${esc(u.name)}</div></div>`).join('')}<div class="bar" style="margin:14px 0 0"><input id="nu" placeholder="Name" style="flex:1"><input id="nue" placeholder="Login email" style="flex:1"><button id="nua">Add</button></div></div>
 <div class="card"><h2>Photos</h2><p class="mut" id="phs2" style="margin-top:0">Checking…</p><div class="row"><button class="p" id="phgo">Copy photos to our storage</button><button id="phst" disabled>Stop</button></div></div></div></div>`;
 wmSettings();
 const ps=async()=>{const r=await api('/admin/photos/status');$('#phs2').textContent=r.r2?`${r.done.toLocaleString()} of ${r.total.toLocaleString()} photos copied`+(r.missing?` · ${r.missing} missing on Proppy (404)`:'')+(r.live?` · Live properties: ${(r.live.done||0).toLocaleString()} of ${r.live.total.toLocaleString()} done${(r.live.done||0)+(r.live.missing||0)>=r.live.total?' ✓ you can stop now':''}`:''):'R2 storage not connected yet';return r};ps();let stop=0;$('#phst').onclick=()=>stop=1;
 $('#phgo').onclick=async()=>{stop=0;$('#phgo').disabled=true;$('#phst').disabled=false;let fails=0,bytes=0,done=0,miss=0;try{for(;;){const r=await api('/admin/photos/migrate',{method:'POST',body:{limit:8}});fails+=r.failed.length;if(r.failed[0])window.__lastErr=r.failed[0].error;bytes+=r.bytes||0;done+=r.copied;miss+=r.missing||0;$('#phs2').textContent=`${done.toLocaleString()} copied${miss?` · ${miss} missing`:''}`+` · ${(bytes/1e9).toFixed(2)} GB this run (free R2 limit 10 GB)`+(fails?` · ${fails} failed (${window.__lastErr})`:'');if(bytes>8e9){$('#phs2').textContent+=' · STOPPED at 8 GB to stay inside the free limit';break}if(stop||!r.remaining||(!r.copied&&!r.missing&&r.failed.length))break}}catch(e){$('#phs2').textContent='Error: '+e.message}$('#phgo').disabled=false;$('#phst').disabled=true};
 $('#nfa').onclick=async()=>{if(!$('#nf').value)return;await api('/features',{method:'POST',body:{label_en:$('#nf').value,grp:$('#ng').value}});settings()};
 $('#noa').onclick=async()=>{if(!$('#no').value)return;await api('/lookups/origin',{method:'POST',body:{label:$('#no').value}});settings()};
 $('#nua').onclick=async()=>{if(!$('#nu').value)return;await api('/users',{method:'POST',body:{name:$('#nu').value,email:$('#nue').value}});settings()}}
async function renF(id,v){await api('/features/'+id,{method:'PUT',body:{label_en:v}});toast('Renamed')}
async function regF(id,g){await api('/features/'+id,{method:'PUT',body:{grp:g}});toast('Moved');settings()}
async function hideF(id,a){await api('/features/'+id,{method:'PUT',body:{active:a}});settings()}
async function delF(id){if(confirm('Delete this feature and remove it from all properties?')){await api('/features/'+id,{method:'DELETE'});settings()}}
async function delLk(k,c){await api(`/lookups/${k}/${encodeURIComponent(c)}`,{method:'DELETE'});settings()}
boot();
</script></body></html>
